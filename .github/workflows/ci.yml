name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn -B -q -DskipTests compile

      - name: Test
        run: mvn -B test

      - name: Package
        run: mvn -B -q -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: back/target/*.jar
          retention-days: 7

  docker:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-assistant:ci ./back