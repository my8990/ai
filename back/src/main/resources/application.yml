server:
  port: 8080
  servlet:
    context-path: /api

spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: ai-assistant
  mvc:
    async:
      request-timeout: ${HTTP_ASYNC_TIMEOUT:180s}
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 60MB
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://localhost:3306/ai_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 200ms
        max-attempts: 3
        multiplier: 2
        max-interval: 2s
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 2
        max-concurrency: 8
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 500ms
          max-attempts: 3
          multiplier: 2
          max-interval: 5s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}
  wxacode-env: ${WECHAT_WXACODE_ENV:release}
  wxacode-page: ${WECHAT_WXACODE_PAGE:pages/live/live}

ai:
  provider: deepseek
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-flash}
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  chat-path: ${AI_CHAT_PATH:/v1/chat/completions}
  max-tokens: ${AI_MAX_TOKENS:2048}
  temperature: ${AI_TEMPERATURE:0.7}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:120}
  max-in-memory-size: ${AI_MAX_IN_MEMORY_SIZE:4194304}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  mq:
    audit:
      enabled: ${MQ_AUDIT_ENABLED:false}
      exchange: ${MQ_AUDIT_EXCHANGE:app.audit.exchange}
      queue: ${MQ_AUDIT_QUEUE:app.audit.queue}
      routing-key: ${MQ_AUDIT_ROUTING_KEY:audit.log}
      dlx: ${MQ_AUDIT_DLX:app.audit.dlx}
      dlq: ${MQ_AUDIT_DLQ:app.audit.dlq}
      dlq-routing-key: ${MQ_AUDIT_DLQ_ROUTING_KEY:audit.dlq}
  security:
    strict-config: ${STRICT_CONFIG:false}
    redis-fail-closed: ${SECURITY_REDIS_FAIL_CLOSED:true}
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      window-minutes: ${LOGIN_ATTEMPT_WINDOW_MINUTES:15}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  checkin:
    qr-secret: ${CHECKIN_QR_SECRET:}
    qr-bucket-seconds: ${CHECKIN_QR_BUCKET_SECONDS:300}
    sweep-interval-ms: ${CHECKIN_SWEEP_INTERVAL_MS:60000}
  live:
    broadcast:
      mode: ${LIVE_BROADCAST_MODE:db}
      poll-interval-ms: ${LIVE_BROADCAST_POLL_INTERVAL_MS:500}
      event-sweep-interval-ms: ${LIVE_BROADCAST_EVENT_SWEEP_INTERVAL_MS:300000}
      exchange: ${MQ_LIVE_EXCHANGE:app.live.broadcast.exchange}
      queue: ${MQ_LIVE_QUEUE:app.live.broadcast.queue}
      routing-key: ${MQ_LIVE_ROUTING_KEY:live.broadcast}
      channel: ${MQ_LIVE_CHANNEL:app.live.broadcast}
    cache:
      mode: ${LIVE_CACHE_MODE:local}
      state-ttl-ms: ${LIVE_STATE_CACHE_TTL_MS:2000}
      sweep-interval-ms: ${LIVE_STATE_CACHE_SWEEP_INTERVAL_MS:60000}
    presence-write-interval-ms: ${LIVE_PRESENCE_WRITE_INTERVAL_MS:10000}
    courseware:
      soffice-path: ${LIVE_SOFFICE_PATH:}
      max-size-mb: ${LIVE_COURSEWARE_MAX_SIZE_MB:50}
      max-pages: ${LIVE_COURSEWARE_MAX_PAGES:200}
      render-dpi: ${LIVE_COURSEWARE_RENDER_DPI:150}
      convert-timeout-ms: ${LIVE_COURSEWARE_CONVERT_TIMEOUT_MS:120000}

amap:
  key: ${AMAP_KEY:}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
  access-url: ${FILE_ACCESS_URL:http://localhost:8080/api/files}
  max-size-mb: ${FILE_MAX_SIZE_MB:20}
  signature:
    enabled: ${FILE_SIGNATURE_ENABLED:true}
    secret: ${FILE_SIGN_SECRET:}
    expires-seconds: ${FILE_SIGN_EXPIRES_SECONDS:600}
    max-expires-seconds: ${FILE_SIGN_MAX_EXPIRES_SECONDS:86400}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    rabbit:
      enabled: ${MQ_HEALTH_ENABLED:false}

logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: info
    com.example.ai: info